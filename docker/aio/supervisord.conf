; GroktoCrawl all-in-one — supervisord base configuration.
; Program definitions are generated at runtime by
; /usr/local/bin/groktocrawl-aio-entrypoint into /etc/supervisor/conf.d/.

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/var/log/groktocrawl/supervisord.log
logfile_maxbytes=20MB
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/groktocrawl

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
