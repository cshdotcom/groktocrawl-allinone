# ============================================================================
# GroktoCrawl 轻量版单镜像编排文件 (All-in-One LITE, branch: lite)
# 镜像: ghcr.io/cshdotcom/groktocrawl-allinone:lite
#
# 一个容器 = 爬虫后台 API + 五层爬虫 + 无头浏览器 + 文档解析
#          + 内嵌 Valkey 缓存队列 + 可选离线演示 LLM + Monitor 定时巡检
#
# LITE 与 full 版的区别: 不含内嵌 SearXNG 搜索 / Qdrant 向量库 /
# semantic-svc(BGE-M3) / 门户 UI / 自主研究 Agent。
# /v2/search、/v2/answer、/v2/agent、/v2/find_similar 等接口不存在;
# scrape/crawl/map/extract/parse/browser 会话/MCP 全部可用。
#
# 对外默认只暴露一个端口:
#   爬虫后台(API/Swagger) → AGENT_HOST_PORT 默认 9080
#
# 所有配置项集中在同目录 .env 文件中(参考 .env.allinone.example):
#   端口 / 存储位置 / AI 大模型 / API 密钥 全部可改。
#
# 快速开始:
#   cp .env.allinone.example .env
#   docker compose up -d
#   curl http://localhost:9080/health
# ============================================================================

services:
  groktocrawl:
    image: ghcr.io/cshdotcom/groktocrawl-allinone:${TAG:-lite}
    container_name: groktocrawl
    hostname: groktocrawl
    restart: unless-stopped

    # ── 端口映射（宿主端口全部由 .env 变量控制, 默认只穿透后台）──
    ports:
      - "${AGENT_HOST_PORT:-9080}:8080"    # 爬虫后台 REST API + Swagger(/docs)
      #
      # —— 可选端口: 取消对应行注释即生效, 宿主端口号在 .env 中改变量即可 ——
      #
      # - "${MCP_HOST_PORT:-9082}:8002"        # MCP 协议(AI 客户端直连)
      # - "${SCRAPER_HOST_PORT:-19001}:8001"   # 五层爬虫执行器
      # - "${BROWSER_HOST_PORT:-19012}:8012"   # 无头浏览器会话服务
      # - "${PARSE_HOST_PORT:-19013}:8013"     # 文档解析(PDF/Office/OCR)
      #
      # 注: 内嵌 Valkey(6379) 绑定容器内 127.0.0.1 不支持直接映射;
      #     需外部访问请改用 VALKEY_URL 指向外部实例并自动让位内嵌组件。

    # ── 配置注入 ───────────────────────────────────────────────────
    # .env 中定义的全部变量原样传入容器(entrypoint 只使用其中相关键)。
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      GROKTOCRAWL_DATA: /data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # 嵌入式组件开关: true=强制启动 false=禁用 auto=无外部地址时自动启动
      # (lite 仅剩 valkey/llm-fixture 两个嵌入组件)
      EMBED_VALKEY: ${EMBED_VALKEY:-auto}
      EMBED_LLM_FIXTURE: ${EMBED_LLM_FIXTURE:-auto}
      MONITOR_SCHEDULER_ENABLED: ${MONITOR_SCHEDULER_ENABLED:-true}
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-600}

      # AI 引用透传(extract/llmstxt 等需要 LLM)
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      VALKEY_URL: ${VALKEY_URL:-}
      API_KEY: ${API_KEY:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}

      # 浏览器动作(navigate/click/wait...)默认超时毫秒; 慢站建议 60000
      BROWSER_NAVIGATE_TIMEOUT_MS: ${BROWSER_NAVIGATE_TIMEOUT_MS:-30000}

      # MCP 鉴权/转发: 取 API_KEY 同值(MCP 的 /mcp 端点用它鉴权,
      # 并随内部调用转发给 agent —— 留空则两者均不鉴权)
      GROKTOCRAWL_API_KEY: ${API_KEY:-}

    volumes:
      # ── 存储位置：修改 DATA_DIR 即可整体搬迁, 或单独覆盖每一行 ──
      - "${DATA_DIR:-./groktocrawl-data}/valkey:/data/valkey"
      - "${DATA_DIR:-./groktocrawl-data}/cloakbrowser:/root/.cloakbrowser" # 反检测浏览器二进制
      # 运行日志(也始终输出到 docker logs)
      - "${DATA_DIR:-./groktocrawl-data}/logs:/var/log/groktocrawl"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s     # lite 版无嵌入模型下载, 启动很快

    stop_grace_period: 35s
    shm_size: "512mb"       # Chromium 渲染需要共享内存
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # lite 版常驻内存约 1-1.5GB(主要是 Chromium + Python 服务), 按需调整
    mem_limit: ${MEM_LIMIT:-3g}
