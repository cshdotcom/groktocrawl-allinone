# GroktoCrawl All-in-One — 构建并推送 GHCR
# 触发: 推送 main / 打 v* 标签 / 手动(可选架构)
name: build-allinone-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # 纯文档/编排/env 模板变更不重建镜像
    paths-ignore:
      - "**.md"
      - "docker-compose*.yml"
      - ".env*"
      - "docs/**"
  workflow_dispatch:
    inputs:
      platforms:
        description: "构建架构"
        required: false
        default: "linux/amd64,linux/arm64"
        type: choice
        options:
          - "linux/amd64,linux/arm64"
          - linux/amd64
          - linux/arm64

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # docker/metadata-action 会自动小写化
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 释放磁盘空间(torch/chromium 多架构层体积较大)
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
                      /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=GroktoCrawl All-in-One
            org.opencontainers.image.description=Firecrawl-compatible web data platform: scraper + search (embedded SearXNG) + semantic retrieval (BGE-M3/Qdrant) in a single container.

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Summary
        run: |
          {
            echo "## 已推送镜像 🐳"
            echo ""
            echo '```'
            for t in $(echo '${{ steps.meta.outputs.tags }}' | tr '\n' ' '); do echo "docker pull $t"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
